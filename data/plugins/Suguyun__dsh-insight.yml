name: Suguyun/dsh-insight
category: browser
description:
  en: 'Chrome/Edge companion extension: select text on a page and click the badge to get a Markdown answer from dsh in the side panel or a floating card, with native multi-turn follow-ups; host-side tools let the agent read the current page, capture HTTP traffic and drive the browser.'
  zh: 'Chrome/Edge 浏览器伴侣扩展：在网页上选中文字后点浮标，dsh 的解读会以 Markdown 显示在侧栏或页面浮窗，并支持多轮追问；宿主侧工具让智能体读取当前页面、抓取 HTTP 流量、操作浏览器。'
icon: https://raw.githubusercontent.com/Suguyun/dsh-insight/main/extension/icons/icon-128.png
